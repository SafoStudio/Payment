<section class="user-detail">
  <header class="user-detail__header">
    <button
      type="button"
      class="user-detail__back"
      (click)="back()"
    >
      ‹ Back to users
    </button>
    <h1 class="user-detail__title">User</h1>
  </header>

  <div class="user-detail__placeholder">
    <p class="user-detail__label">User ID</p>
    <p class="user-detail__id">{{ userId }}</p>
    <p class="user-detail__hint">User details will appear here.</p>
  </div>
</section>
