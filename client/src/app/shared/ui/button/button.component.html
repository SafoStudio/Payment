<button
  [type]="type()"
  [class]="'btn btn--' + variant()"
  [class.btn--full]="fullWidth()"
  [class.btn--loading]="loading()"
  [disabled]="disabled() || loading()"
  (click)="onClick($event)"
>
  @if (loading()) {
  <span class="btn__spinner" aria-hidden="true"></span>
  }
  <ng-content />
</button>
