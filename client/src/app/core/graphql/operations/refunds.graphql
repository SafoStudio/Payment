query Refunds($filter: RefundFilterInput, $limit: Int, $after: String) {
  refunds(filter: $filter, limit: $limit, after: $after) {
    items {
      id
      paymentId
      amount
      currency
      status
      reason
      originalTransactionId
      refundTransactionId
      providerId
      providerReference
      failureReason
      createdAt
      updatedAt
    }
    nextCursor
    hasMore
  }
}

mutation CreateRefund($input: CreateRefundInput!) {
  createRefund(input: $input) {
    id
    paymentId
    amount
    currency
    status
    reason
    originalTransactionId
    refundTransactionId
    providerId
    providerReference
    failureReason
    createdAt
    updatedAt
  }
}
