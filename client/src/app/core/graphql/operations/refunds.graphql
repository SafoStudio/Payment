query Refunds($filter: RefundFilterInput, $limit: Int, $after: String) {
  refunds(filter: $filter, limit: $limit, after: $after) {
    items {
      id
      paymentId
      amount
      currency
      status
      reason
      originalTransactionId
      refundTransactionId
      createdAt
      updatedAt
    }
    nextCursor
    hasMore
  }
}
