query Providers($status: ProviderStatus, $type: ProviderType, $limit: Int, $after: String) {
  providers(status: $status, type: $type, limit: $limit, after: $after) {
    items {
      id
      code
      name
      adapterKey
      status
      type
      config
      lastCheckedAt
      createdAt
      updatedAt
      hasCredentials
      capabilities {
        id
        method
        currency
        minAmount
        maxAmount
        enabled
        createdAt
        updatedAt
      }
    }
    nextCursor
    hasMore
  }
}

query Provider($id: ID!) {
  provider(id: $id) {
    id
    code
    name
    adapterKey
    status
    type
    config
    lastCheckedAt
    createdAt
    updatedAt
    hasCredentials
    capabilities {
      id
      method
      currency
      minAmount
      maxAmount
      enabled
      createdAt
      updatedAt
    }
  }
}

query ProviderCapabilities($providerId: ID!) {
  providerCapabilities(providerId: $providerId) {
    id
    method
    currency
    minAmount
    maxAmount
    enabled
    createdAt
    updatedAt
  }
}

query ProviderCredentialKeys($providerId: ID!) {
  providerCredentialKeys(providerId: $providerId) {
    id
    credentialKey
    createdAt
    rotatedAt
  }
}

mutation CreateProvider($input: CreateProviderInput!) {
  createProvider(input: $input) {
    id
    code
    name
    adapterKey
    status
    type
    config
    lastCheckedAt
    createdAt
    updatedAt
    hasCredentials
    capabilities {
      id
      method
      currency
      minAmount
      maxAmount
      enabled
      createdAt
      updatedAt
    }
  }
}

mutation UpdateProvider($id: ID!, $input: UpdateProviderInput!) {
  updateProvider(id: $id, input: $input) {
    id
    code
    name
    adapterKey
    status
    type
    config
    lastCheckedAt
    createdAt
    updatedAt
    hasCredentials
    capabilities {
      id
      method
      currency
      minAmount
      maxAmount
      enabled
      createdAt
      updatedAt
    }
  }
}

mutation ActivateProvider($id: ID!) {
  activateProvider(id: $id) {
    id
    status
    updatedAt
  }
}

mutation DegradeProvider($id: ID!) {
  degradeProvider(id: $id) {
    id
    status
    updatedAt
  }
}

mutation DisableProvider($id: ID!) {
  disableProvider(id: $id) {
    id
    status
    updatedAt
  }
}

mutation MarkProviderChecked($id: ID!) {
  markProviderChecked(id: $id) {
    id
