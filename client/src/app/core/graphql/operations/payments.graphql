query Payments($filter: PaymentFilterInput, $limit: Int, $after: String) {
  payments(filter: $filter, limit: $limit, after: $after) {
    items {
      id
      walletId
      targetWalletId
      amount
      currency
      method
      status
      type
      description
      providerId
      createdAt
      updatedAt
    }
    nextCursor
    hasMore
  }
}

mutation CreatePayment($input: CreatePaymentInput!) {
  createPayment(input: $input) {
    id
    walletId
    targetWalletId
    amount
    currency
    method
    status
    type
    providerId
    providerReference
    failureReason
    createdAt
    updatedAt
  }
}
